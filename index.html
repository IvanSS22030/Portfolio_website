<!doctype html>
<html lang="en" class="theme-professional">
  <head>
    <meta charset="UTF-8" />
    <!-- Rusted pixel-art gear: the SVG stays crisp at any size; the .ico is for older browsers -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Pirata+One&display=swap" rel="stylesheet">
    <title>Ivan Joel Sanchez | Portfolio</title>
  </head>
  <body class="min-h-screen bg-white">
    <div id="root"></div>
    <!-- Netlify Forms only detects forms in static HTML; the visible one lives in Contact.tsx -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
